# /etc/nginx/sites-available/itvh.dev
# ln -s /etc/nginx/sites-available/itvh.dev /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx

upstream itvh_app {
    server 127.0.0.1:3001;
    keepalive 64;
}

# www → основной домен
server {
    listen 80;
    listen [::]:80;
    server_name www.itvh.dev;

    return 301 http://itvh.dev$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name itvh.dev;

    access_log /var/log/nginx/itvh.dev.access.log;
    error_log  /var/log/nginx/itvh.dev.error.log;

    client_max_body_size 20m;

    location / {
        proxy_pass http://itvh_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Next.js static assets (опционально, можно убрать — приложение отдаст само)
    location /_next/static/ {
        proxy_pass http://itvh_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
